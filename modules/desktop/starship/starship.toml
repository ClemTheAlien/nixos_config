"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#b16286)\
$os\
$username\
[](bg:#cc241d fg:#b16286)\
$directory\
[](fg:#cc241d bg:#d79921)\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
[](fg:#d79921 bg:#458588)\
$nix_shell\
[](fg:#458588 bg:#689d6a)\
$docker_context\
[](fg:#689d6a bg:#d65d0e)\
$sudo\
[ ](fg:#d65d0e)\
"""

add_newline = false

[username]
show_always = true
style_user = "bg:#b16286 fg:#ebdbb2"
style_root = "bg:#b16286 fg:#ebdbb2"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:#b16286 fg:#ebdbb2"
disabled = true # Disabled by default

[directory]
style = "bg:#cc241d fg:#ebdbb2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
style = "bg:#d79921 fg:#ebdbb2"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:#d79921 fg:#ebdbb2"
format = '[$all_status$ahead_behind ]($style)'

[nix_shell]
symbol = " "
style = "bg:#458588 fg:#ebdbb2"
format = '[ $symbol($state) ]($style)'

[docker_context]
symbol = " "
style = "bg:#689d6a fg:#ebdbb2"
format = '[ $symbol($context) ]($style)'

[sudo]
symbol = " "
style = "bg:#d65d0e fg:#ebdbb2"
format = '[ $symbol ]($style)'
disabled = false

[time]
disabled = false
time_format = "%R"
style = "bg:#d65d0e fg:#ebdbb2"
format = '[ ♥ $time ]($style)'
